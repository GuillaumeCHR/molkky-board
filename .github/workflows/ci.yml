name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Vérifie que gradle-wrapper.jar n'a pas été altéré.
          validate-wrappers: true

      - name: Lint
        run: ./gradlew ktlintCheck detekt lintDebug

      - name: Tests unitaires et couverture du moteur
        run: ./gradlew test :core:scoring:koverVerify

      - name: APK debug
        run: ./gradlew :app:assembleDebug

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v7
        with:
          name: molkky-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
