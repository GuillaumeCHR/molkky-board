name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Vérifie que gradle-wrapper.jar n'a pas été altéré.
          validate-wrappers: true

      - name: Lint
        run: ./gradlew ktlintCheck detekt lintDebug

      - name: Tests unitaires et couverture du moteur
        run: ./gradlew test :core:scoring:koverVerify :core:sync:koverVerify :app:checkDebugPermissions :app:checkReleasePermissions

      - name: APK debug
        run: ./gradlew :app:assembleDebug

      # « Traceurs : 0 » (générique, encart Vie privée) : signatures de code d'Exodus Privacy sur l'APK non minifié.
      - name: Aucun traceur (signatures Exodus Privacy)
        run: |
          python3 -I tools/trackers/check_trackers.py --self-test
          python3 -I tools/trackers/check_trackers.py app/build/outputs/apk/debug/app-debug.apk

      # SBOM CycloneDX de ce qui est livré dans l'APK de release, puis recherche de vulnérabilités connues (OSV).
      - name: SBOM CycloneDX
        run: ./gradlew :app:cyclonedxDirectBom

      - name: Vulnérabilités connues (osv-scanner)
        env:
          OSV_VERSION: v2.7.0
          OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c
          chmod +x osv-scanner
          ./osv-scanner scan source -L app/build/reports/cyclonedx-direct/bom.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-cyclonedx
          path: app/build/reports/cyclonedx-direct/bom.*

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v7
        with:
          name: molkky-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
