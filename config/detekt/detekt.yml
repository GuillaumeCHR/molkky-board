# Surcharges de la configuration par défaut de detekt (buildUponDefaultConfig = true).
naming:
  MatchingDeclarationName:
    # Un fichier Compose regroupe un composant et ses types associés.
    active: false
  FunctionNaming:
    # Les fonctions @Composable commencent par une majuscule.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
complexity:
  TooManyFunctions:
    thresholdInFiles: 20
    # Les DAO Room regroupent naturellement de nombreuses requêtes.
    thresholdInInterfaces: 25
    # Les ViewModels d'écran exposent une action par geste de l'utilisateur.
    thresholdInClasses: 20
  LongParameterList:
    functionThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
style:
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    # Les validations du moteur s'écrivent en clauses de garde (`?: return Outcome.Err(...)`).
    max: 3
    excludeGuardClauses: true
    excludeReturnFromLambda: true
  MagicNumber:
    # Valeurs du jeu (12 quilles, 50 points…) : lisibles telles quelles dans les tests et les constantes.
    # Le design system et l'intro animée sont faits de valeurs de design (tailles, proportions, couleurs,
    # timings) : on ne les nomme pas toutes. Même chose pour le dessin du mini-clip de partage, et pour
    # l'encodeur GIF dont les octets sont imposés par le format (GIF89a).
    excludes: ['**/test/**', '**/*Test.kt', '**/designsystem/**', '**/feature/intro/**', '**/ReelRenderer.kt', '**/GifEncoder.kt']
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
